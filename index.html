<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3b82f6">
    <title>🚖 出租车记账</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 15px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 6px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .form-row {
            display: flex;
            gap: 12px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            margin-top: 10px;
        }
        
        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
            margin-top: 10px;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
            margin-top: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .stat-item {
            background: #f9fafb;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        
        .record-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .record-item {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .record-item:last-child {
            border-bottom: none;
        }
        
        .record-date {
            font-weight: 600;
            color: #1f2937;
        }
        
        .record-income {
            color: #10b981;
            font-weight: 600;
        }
        
        .record-delete {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #9ca3af;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .calculated-field {
            background: #f0fdf4;
            border-color: #86efac !important;
            color: #166534;
            font-weight: 600;
        }
        
        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 10px;
        }
        
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }
        
        .sync-dot.syncing {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        
        .sync-dot.error {
            background: #ef4444;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .login-section {
            text-align: center;
            padding: 20px;
        }
        
        .login-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .hidden {
            display: none;
        }
        
        .sync-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .sync-buttons .btn {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚖 出租车记账</h1>
            <p>云端同步 · 多设备访问</p>
        </div>
        
        <!-- 登录区域 -->
        <div class="card" id="login-card">
            <div class="card-title">🔐 GitHub 登录</div>
            <div class="login-section">
                <p style="margin-bottom:15px;color:#6b7280;font-size:14px">
                    登录后数据会同步到 GitHub，任何设备都能查看
                </p>
                <input type="text" id="github-token" placeholder="输入 GitHub Token">
                <button class="btn btn-primary" onclick="saveToken()">登录</button>
                <p style="margin-top:15px;font-size:12px;color:#6b7280">
                    <a href="https://github.com/settings/tokens/new" target="_blank" style="color:#667eea">获取 Token</a> | 
                    <a href="#" onclick="showTokenHelp();return false;" style="color:#667eea">如何使用？</a>
                </p>
            </div>
        </div>
        
        <!-- 主应用区域（登录后显示） -->
        <div id="app-section" class="hidden">
            <!-- 同步状态 -->
            <div class="card">
                <div class="sync-status">
                    <div class="sync-dot" id="sync-dot"></div>
                    <span id="sync-text">已同步到云端</span>
                </div>
                <div class="sync-buttons">
                    <button class="btn btn-secondary" onclick="syncData()">🔄 立即同步</button>
                    <button class="btn btn-secondary" onclick="logout()">退出登录</button>
                </div>
            </div>
            
            <!-- 统计卡片 -->
            <div class="card">
                <div class="card-title">📊 统计</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-days">0</div>
                        <div class="stat-label">工作天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-trips">0</div>
                        <div class="stat-label">总趟数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-income">¥0</div>
                        <div class="stat-label">总收入</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-net">¥0</div>
                        <div class="stat-label">净收入</div>
                    </div>
                </div>
            </div>
            
            <!-- 记账表单 -->
            <div class="card">
                <div class="card-title">📝 新增记录</div>
                <form id="record-form">
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="date" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>开车时间</label>
                            <input type="time" id="start-time" required>
                        </div>
                        <div class="form-group">
                            <label>关车时间</label>
                            <input type="time" id="end-time" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>趟数</label>
                            <input type="number" id="trips" min="0" placeholder="0" required>
                        </div>
                        <div class="form-group">
                            <label>收入 (元)</label>
                            <input type="number" id="income" min="0" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>油费/电费 (元)</label>
                            <input type="number" id="fuel" min="0" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>过路费 (元)</label>
                            <input type="number" id="toll" min="0" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>净收入 (自动计算)</label>
                        <input type="text" id="net-income" class="calculated-field" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="note" placeholder="特殊情况、天气、路况等..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">💾 保存并同步</button>
                </form>
            </div>
            
            <!-- 记录列表 -->
            <div class="card">
                <div class="card-title">📋 最近记录</div>
                <div class="record-list" id="record-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>还没有记录，开始记账吧！</p>
                    </div>
                </div>
                <div class="sync-buttons">
                    <button class="btn btn-secondary" onclick="exportData()">📤 导出 CSV</button>
                    <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空所有数据</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        // 配置
        const GITHUB_OWNER = 'maxmgleong';
        const GITHUB_REPO = 'taxi-accounting';
        const DATA_FILE = 'data/records.json';
        
        // 状态
        let records = [];
        let githubToken = localStorage.getItem('github-token') || '';
        
        // 初始化
        document.getElementById('date').valueAsDate = new Date();
        
        // 检查是否已登录
        if (githubToken) {
            document.getElementById('github-token').value = githubToken;
            showApp();
            loadData();
        }
        
        // 保存 Token
        function saveToken() {
            const token = document.getElementById('github-token').value.trim();
            if (!token) {
                showToast('❌ 请输入 Token');
                return;
            }
            githubToken = token;
            localStorage.setItem('github-token', token);
            showApp();
            loadData();
            showToast('✅ 登录成功');
        }
        
        // 显示应用
        function showApp() {
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
        }
        
        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？数据仍会保存在云端，下次登录可恢复。')) {
                githubToken = '';
                localStorage.removeItem('github-token');
                document.getElementById('github-token').value = '';
                document.getElementById('login-card').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
                showToast('👋 已退出登录');
            }
        }
        
        // 设置同步状态
        function setSyncStatus(status, text) {
            const dot = document.getElementById('sync-dot');
            const txt = document.getElementById('sync-text');
            dot.className = 'sync-dot';
            if (status === 'syncing') dot.classList.add('syncing');
            if (status === 'error') dot.classList.add('error');
            txt.textContent = text;
        }
        
        // 从 GitHub 加载数据
        async function loadData() {
            if (!githubToken) return;
            
            try {
                setSyncStatus('syncing', '正在从云端加载...');
                const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`, {
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const content = atob(data.content);
                    records = JSON.parse(content);
                    updateStats();
                    renderRecords();
                    setSyncStatus('success', `已同步 - ${records.length} 条记录`);
                } else if (response.status === 404) {
                    // 文件不存在，创建新数据
                    records = [];
                    await saveData();
                    setSyncStatus('success', '云端数据已初始化');
                } else {
                    throw new Error('加载失败');
                }
            } catch (e) {
                console.error(e);
                setSyncStatus('error', '同步失败，使用本地数据');
                // 回退到本地存储
                records = JSON.parse(localStorage.getItem('taxi-records')) || [];
                updateStats();
                renderRecords();
            }
        }
        
        // 保存数据到 GitHub
        async function saveData() {
            if (!githubToken) {
                // 没有 Token，保存到本地
                localStorage.setItem('taxi-records', JSON.stringify(records));
                return;
            }
            
            try {
                setSyncStatus('syncing', '正在同步到云端...');
                
                // 先获取当前文件的 SHA
                let sha = null;
                const getResponse = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`, {
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (getResponse.ok) {
                    const getData = await getResponse.json();
                    sha = getData.sha;
                }
                
                // 准备数据
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(records, null, 2))));
                const body = {
                    message: 'Update taxi records ' + new Date().toISOString(),
                    content: content
                };
                if (sha) body.sha = sha;
                
                // 确保 data 目录存在（GitHub 会自动创建）
                const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (response.ok) {
                    setSyncStatus('success', '已同步到云端');
                    // 也保存到本地作为备份
                    localStorage.setItem('taxi-records', JSON.stringify(records));
                } else {
                    throw new Error('保存失败');
                }
            } catch (e) {
                console.error(e);
                setSyncStatus('error', '同步失败');
                // 保存到本地作为备份
                localStorage.setItem('taxi-records', JSON.stringify(records));
                showToast('⚠️ 云端同步失败，已保存到本地');
            }
        }
        
        // 手动同步
        async function syncData() {
            await saveData();
            await loadData();
        }
        
        // 自动计算净收入
        function calculateNetIncome() {
            const income = parseFloat(document.getElementById('income').value) || 0;
            const fuel = parseFloat(document.getElementById('fuel').value) || 0;
            const toll = parseFloat(document.getElementById('toll').value) || 0;
            const net = income - fuel - toll;
            document.getElementById('net-income').value = net.toFixed(2);
        }
        
        ['income', 'fuel', 'toll'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculateNetIncome);
        });
        
        // 保存记录
        document.getElementById('record-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const record = {
                id: Date.now(),
                date: document.getElementById('date').value,
                startTime: document.getElementById('start-time').value,
                endTime: document.getElementById('end-time').value,
                trips: parseInt(document.getElementById('trips').value) || 0,
                income: parseFloat(document.getElementById('income').value) || 0,
                fuel: parseFloat(document.getElementById('fuel').value) || 0,
                toll: parseFloat(document.getElementById('toll').value) || 0,
                netIncome: parseFloat(document.getElementById('net-income').value) || 0,
                note: document.getElementById('note').value
            };
            
            records.unshift(record);
            
            // 保存到云端
            await saveData();
            
            showToast('✅ 记录已保存并同步');
            this.reset();
            document.getElementById('date').valueAsDate = new Date();
            updateStats();
            renderRecords();
        });
        
        // 更新统计
        function updateStats() {
            const days = records.length;
            const trips = records.reduce((sum, r) => sum + r.trips, 0);
            const income = records.reduce((sum, r) => sum + r.income, 0);
            const net = records.reduce((sum, r) => sum + r.netIncome, 0);
            
            document.getElementById('stat-days').textContent = days;
            document.getElementById('stat-trips').textContent = trips;
            document.getElementById('stat-income').textContent = '¥' + income.toFixed(0);
            document.getElementById('stat-net').textContent = '¥' + net.toFixed(0);
        }
        
        // 渲染记录列表
        function renderRecords() {
            const list = document.getElementById('record-list');
            
            if (records.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>还没有记录，开始记账吧！</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = records.slice(0, 10).map(r => `
                <div class="record-item">
                    <div>
                        <div class="record-date">${r.date}</div>
                        <div style="font-size:12px;color:#6b7280">
                            ${r.startTime}-${r.endTime} | ${r.trips}趟
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:10px">
                        <div class="record-income">+¥${r.income.toFixed(0)}</div>
                        <button class="record-delete" onclick="deleteRecord(${r.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 删除记录
        async function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                records = records.filter(r => r.id !== id);
                await saveData();
                showToast('🗑️ 记录已删除');
                updateStats();
                renderRecords();
            }
        }
        
        // 清空所有数据
        async function clearAllData() {
            if (confirm('⚠️ 确定要清空所有数据吗？此操作不可恢复！')) {
                records = [];
                await saveData();
                showToast('🗑️ 所有数据已清空');
                updateStats();
                renderRecords();
            }
        }
        
        // 导出 CSV
        function exportData() {
            if (records.length === 0) {
                showToast('📭 没有数据可导出');
                return;
            }
            
            const headers = ['日期', '开车时间', '关车时间', '趟数', '收入', '油费/电费', '过路费', '净收入', '备注'];
            const rows = records.map(r => [
                r.date,
                r.startTime,
                r.endTime,
                r.trips,
                r.income,
                r.fuel,
                r.toll,
                r.netIncome,
                r.note
            ]);
            
            const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `出租车记账_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            showToast('📤 导出成功');
        }
        
        // 提示框
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        // Token 帮助
        function showTokenHelp() {
            alert(`获取 GitHub Token 步骤：

1. 打开 https://github.com/settings/tokens/new
2. Token name: 随意填（如 taxi-app）
3. 勾选：repo（全部权限）
4. 点击 Generate token
5. 复制生成的 token（只显示一次！）
6. 粘贴到上面的输入框

⚠️ Token 只会在你浏览器本地保存，不会发送给任何人。`);
        }
        
        // 初始化
        updateStats();
        renderRecords();
    </script>
</body>
</html>
